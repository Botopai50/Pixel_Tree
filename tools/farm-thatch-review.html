<!doctype html><html><meta charset="utf-8"><title>Fazenda com palha</title><style>body{margin:20px;background:#18252d;color:white;font:18px system-ui}img{max-width:100%}button{padding:12px}</style><h1>Palha na casa, no galpão e na varanda</h1><img id="proof" alt="Fazenda com cobertura de palha"><p><button id="save">Salvar PNG</button></p><script type="module">
import * as THREE from 'three';import {createStructure} from '../src/structures/generator.ts';import {STRUCTURE_PRESETS} from '../src/structures/catalog.ts';
const source=STRUCTURE_PRESETS.structure_farm,asset=createStructure({...source,seed:4292}),scene=new THREE.Scene();scene.background=new THREE.Color('#91c9de');scene.add(asset.group);scene.add(new THREE.HemisphereLight('#ffffff','#526947',2));const light=new THREE.DirectionalLight('#fff2d9',2.5);light.position.set(-15,25,-12);scene.add(light);
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(850,620);renderer.setPixelRatio(1);const center=asset.bounds.getCenter(new THREE.Vector3()),size=asset.bounds.getSize(new THREE.Vector3()),span=Math.max(size.x,size.y,size.z)*1.4;const camera=new THREE.OrthographicCamera(-span/2,span/2,span*620/850/2,-span*620/850/2,.01,150);camera.position.copy(center).add(new THREE.Vector3(-18,13,-22));camera.lookAt(center);renderer.render(scene,camera);const url=renderer.domElement.toDataURL('image/png');document.querySelector('#proof').src=url;renderer.dispose();asset.dispose();document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='fazenda-palha.png';a.click();};
</script></html>
