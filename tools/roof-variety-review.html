<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Variação automática de telhados</title><style>body{margin:20px;background:#18252d;color:white;font:18px system-ui}img{max-width:100%}button{padding:12px}</style><h1>Casas comuns · quatro coberturas automáticas</h1><img id="proof" alt="Duas águas, quatro águas, uma água e terraço"><p><button id="save">Salvar PNG</button></p><script type="module">
import * as THREE from 'three';import {buildStructurePlan} from '../src/structures/plan.ts';import {createStructure} from '../src/structures/generator.ts';import {STRUCTURE_PRESETS} from '../src/structures/catalog.ts';
const source=STRUCTURE_PRESETS.structure_house,config={...source.structure,roof:'auto',annexes:false,balconies:false,vegetation:0},seeds=new Map();for(let seed=1;seed<=150;seed++){const p=buildStructurePlan({...source,seed,structure:config});const k=p.roofs[0].kind;if(!seeds.has(k))seeds.set(k,seed);}
const out=document.createElement('canvas');out.width=1000;out.height=880;const ctx=out.getContext('2d');ctx.fillStyle='#18252d';ctx.fillRect(0,0,1000,880);const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(500,400);renderer.setPixelRatio(1);
const kinds=[['gable','Duas águas'],['hip','Quatro águas'],['shed','Uma água'],['flat','Terraço']];for(const [i,[kind,name]] of kinds.entries()){
const seed=seeds.get(kind),asset=createStructure({...source,seed,structure:config}),scene=new THREE.Scene();scene.background=new THREE.Color('#91c9de');scene.add(asset.group);scene.add(new THREE.HemisphereLight('#ffffff','#526947',2));const light=new THREE.DirectionalLight('#fff2d9',2.5);light.position.set(-15,25,-12);scene.add(light);
const center=asset.bounds.getCenter(new THREE.Vector3()),size=asset.bounds.getSize(new THREE.Vector3()),span=Math.max(size.x,size.y,size.z)*1.3,camera=new THREE.OrthographicCamera(-span/2,span/2,span*.4,-span*.4,.01,100);camera.position.copy(center).add(new THREE.Vector3(-12,8,-18));camera.lookAt(center);renderer.render(scene,camera);const x=(i%2)*500,y=Math.floor(i/2)*440;ctx.drawImage(renderer.domElement,x,y+40);ctx.fillStyle='white';ctx.font='18px sans-serif';ctx.fillText(name+' · semente '+seed,x+12,y+27);asset.dispose();}
renderer.dispose();const url=out.toDataURL('image/png');document.querySelector('#proof').src=url;document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='telhados-variados.png';a.click();};
</script></html>
