<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Revisão rural e telhas</title><style>body{margin:20px;background:#18252d;color:white;font:18px system-ui}img{max-width:100%}button{padding:12px}</style><h1>Moinho com torre de pedra e velas de tecido</h1><img id="proof" alt="Celeiro de palha, torre com escada de madeira e telhados de telha"><p><button id="save">Salvar PNG</button></p><script type="module">
import * as THREE from 'three';import {buildStructurePlan} from '../src/structures/plan.ts';import {createStructure} from '../src/structures/generator.ts';import {STRUCTURE_PRESETS} from '../src/structures/catalog.ts';
let roofSeed=1;const home=STRUCTURE_PRESETS.structure_largeHouse;for(let seed=1;seed<=120;seed++){const p=buildStructurePlan({...home,seed});if(p.roofs.some(r=>r.kind==='shed')&&p.roofs.some(r=>r.kind==='gable'||r.kind==='hip')){roofSeed=seed;break;}}
const views=[['Moinho','windmill',1],['Moinho','windmill',777],['Moinho','windmill',2590]],out=document.createElement('canvas');out.width=1800;out.height=500;const ctx=out.getContext('2d');ctx.fillStyle='#18252d';ctx.fillRect(0,0,1800,500);const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(600,460);renderer.setPixelRatio(1);
for(const [i,[name,kind,seed]] of views.entries()){
const source=STRUCTURE_PRESETS['structure_'+kind],asset=createStructure({...source,seed}),scene=new THREE.Scene();scene.background=new THREE.Color('#91c9de');scene.add(asset.group);scene.add(new THREE.HemisphereLight('#ffffff','#526947',2));const light=new THREE.DirectionalLight('#fff2d9',2.5);light.position.set(-15,25,-12);scene.add(light);
const center=asset.bounds.getCenter(new THREE.Vector3()),size=asset.bounds.getSize(new THREE.Vector3());let span=Math.max(size.x,size.y*1.45,size.z)*1.28;if(i===2){const body=buildStructurePlan({...source,seed}).pieces.filter(p=>p.role==='mill-body')[1];center.set(0,body.position[1]+body.size[1]*.1,-(body.size[0]+(body.size[2]-body.size[0])*.6)/2*Math.cos(Math.PI/12));span=2.5;}const camera=new THREE.OrthographicCamera(-span/2,span/2,span*460/600/2,-span*460/600/2,.01,150);camera.position.copy(center).add(new THREE.Vector3(i===1?15:-8,5,-22));camera.lookAt(center);renderer.render(scene,camera);ctx.drawImage(renderer.domElement,i*600,40);ctx.fillStyle='white';ctx.font='18px sans-serif';ctx.fillText(name+' · '+seed,i*600+12,27);asset.dispose();}
renderer.dispose();const url=out.toDataURL('image/png');document.querySelector('#proof').src=url;document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='moinho-cobertura.png';a.click();};
</script></html>
