<!doctype html><html><meta charset="utf-8"><title>Portas de madeira</title><style>body{margin:20px;background:#18252d;color:white;font:18px system-ui}img{max-width:100%}button{padding:12px}</style><h1>Porta com fresta escura e ferragens</h1><img id="proof" alt="Porta com contorno escuro na parede de madeira"><p><button id="save">Salvar PNG</button></p><script type="module">
import * as THREE from 'three';import {createStructure} from '../src/structures/generator.ts';import {STRUCTURE_PRESETS} from '../src/structures/catalog.ts';
const source=STRUCTURE_PRESETS.structure_cabin,asset=createStructure({...source,seed:4292}),scene=new THREE.Scene();scene.background=new THREE.Color('#91c9de');scene.add(asset.group);scene.add(new THREE.HemisphereLight('#ffffff','#526947',2));const light=new THREE.DirectionalLight('#fff2d9',2.5);light.position.set(-15,25,-12);scene.add(light);
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(850,620);renderer.setPixelRatio(1);const plan=asset.group.userData.structurePlan,opening=plan.openings.find(o=>o.kind==='door'),wall=plan.walls.find(w=>w.id===opening.wall),along=new THREE.Vector3(...wall.end).sub(new THREE.Vector3(...wall.start)).normalize();const center=new THREE.Vector3(...wall.start).add(new THREE.Vector3(...wall.end)).multiplyScalar(.5).addScaledVector(along,opening.offset);center.y=wall.bottom+opening.height/2;const span=3.6;const camera=new THREE.OrthographicCamera(-span/2,span/2,span*620/850/2,-span*620/850/2,.01,150);camera.position.copy(center).add(new THREE.Vector3(-2,1,-12));camera.lookAt(center);renderer.render(scene,camera);const url=renderer.domElement.toDataURL('image/png');document.querySelector('#proof').src=url;renderer.dispose();asset.dispose();document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='porta-fresta.png';a.click();};
</script></html>
