<!doctype html><html><head><meta charset="utf-8"><title>Structure QA</title><link rel="icon" href="data:,"><style>body{margin:0;background:#8cb9ca}canvas{display:block}#label{position:absolute;top:16px;left:16px;font:20px sans-serif;background:#222c;color:white;padding:12px}</style></head><body><div id="label"></div><script type="module">
import * as THREE from 'three';import {createStructure} from '../src/structures/generator.ts';import {STRUCTURE_PRESETS} from '../src/structures/catalog.ts';import {assetFrame} from '../src/assets/framing.ts';
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#8cb9ca');scene.add(new THREE.HemisphereLight('#e9f5ff','#526947',2));const light=new THREE.DirectionalLight('#fff2d9',2.5);light.position.set(-15,25,12);light.castShadow=true;light.shadow.mapSize.set(2048,2048);scene.add(light);scene.add(light.target);
const blackMaterial=new THREE.MeshBasicMaterial({color:'#171f22',side:THREE.DoubleSide});const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,1000);let asset;
window.qa={renderer,scene,camera,types:Object.keys(STRUCTURE_PRESETS),async render(id,patch={},angle=0,black=false){if(asset){scene.remove(asset.group);asset.dispose();}renderer.renderLists.dispose();const start=performance.now(),source=STRUCTURE_PRESETS[id];asset=createStructure({...source,structure:{...source.structure,...patch}});scene.add(asset.group);scene.overrideMaterial=black?blackMaterial:null;const ms=performance.now()-start;const bounds=new THREE.Box3().setFromObject(asset.group),center=bounds.getCenter(new THREE.Vector3()),f=assetFrame(bounds,camera.aspect,camera.fov);window.qa.center=center;window.qa.distance=f.distance;camera.near=f.near;camera.far=f.far;camera.updateProjectionMatrix();camera.position.copy(center).add(new THREE.Vector3(Math.cos(angle),.75,Math.sin(angle)).normalize().multiplyScalar(f.distance));camera.lookAt(center);light.position.copy(center).add(new THREE.Vector3(-15,30,15));light.target.position.copy(center);const half=f.shadowSpan;Object.assign(light.shadow.camera,{left:-half,right:half,top:half,bottom:-half,far:half*5+50});light.shadow.camera.updateProjectionMatrix();document.getElementById('label').textContent=source.name+' / '+source.seed;renderer.render(scene,camera);return {ms,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,memory:renderer.info.memory};},dispose(){asset.dispose();scene.remove(asset.group);renderer.renderLists.dispose();renderer.render(scene,camera);return renderer.info.memory;}};
await window.qa.render('structure_house',{},1.1);window.qa.ready=true;
</script></body></html>
